<!doctype html>
<!-- Entry point for the remote desktop. noVNC itself lives untouched in
     ./novnc (fetched by bootstrap.sh); its settings are passed as URL
     parameters: connect immediately, reconnect if the link drops, and scale
     the desktop to fit this browser window. The desktop keeps its own fixed
     size (see desktop-x.service): resizing it to the window gave websites an
     odd screen size. -->
<meta charset="utf-8">
<title>Desktop</title>
<meta http-equiv="refresh" content="0; url=novnc/vnc.html?autoconnect=1&reconnect=1&resize=scale">
<a href="novnc/vnc.html?autoconnect=1&reconnect=1&resize=scale">Open the desktop</a>
