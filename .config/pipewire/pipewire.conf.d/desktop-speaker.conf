# One virtual speaker for the remote desktop (see step 11 of ~/bootstrap.sh).
# The VM has no sound card, and a browser that reports no audio devices at all
# looks like a server. Whatever plays here goes nowhere: noVNC carries no sound.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "desktop-speaker"
      node.description = "Speakers"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
    }
  }
]
